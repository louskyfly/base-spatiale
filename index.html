  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .bigbtn { background: #7b2cbf; padding: 12px 16px; font-weight: 900; font-size: 17px; flex: 1; min-width: 140px; box-shadow: 0 4px 0 #00000066; }
  .bigbtn.green { background: #2a9d8f; } .bigbtn.red { background: #c1121f; } .bigbtn.grey { background: #4a4e69; } .bigbtn.gold { background: #e9a100; color: #1b1033; }
  .bigbtn:disabled { opacity: .4; }

  .tool .ic { font-size: 26px; } .tool .tx { flex: 1; font-size: 14px; line-height: 1.3; } .tool b { font-size: 15px; }

  table.st { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }

  .stat.bad { background: #c1121f88; } .stat.ok { background: #2a9d8f88; }
  #mapCv { width: min(80vh, 86vw); height: min(80vh, 86vw); image-rendering: pixelated; border-radius: 10px; border: 3px solid #ffffff33; display: block; margin: 6px auto; background: #000; }

<body>

    <button class="sbtn" id="btnJour">📜</button><button class="sbtn" id="btnMap">🗺️</button><button class="sbtn" id="btnPause">⏸</button>

  </div>
</div>

<button id="btnAct"><span id="actIc">⛏️</span><span id="actTx">Miner</span></button>

  <canvas id="titleRobot" width="14" height="14"></canvas>
  <h1>BASE SPATIALE</h1>
  <div class="sub">Petit robot pilote · planète inconnue · retrouve ton équipage et rentre chez toi</div>
  <div class="row">
    <button class="bigbtn green" id="btnCont">▶ Continuer</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TS = 16, MW = 384, MH = 384, CELL = 32, CC = 96, CW = MW / 2; // cellules de 2x2 tuiles
const CORE_X = CC * CELL + 16, CORE_Y = CC * CELL + 16, CTX_ = MW / 2, CTY_ = MH / 2;
const DAY_LEN = 150, NIGHT_LEN = 75, CYCLE = DAY_LEN + NIGHT_LEN;
const CH = 32; // taille d'un morceau de carte (tuiles)
const EXP = 8, EW = MW / EXP; // grille d'exploration (8x8 tuiles)
const SAVE_KEY = 'baseSpatiale.v2', OLD_KEY = 'baseSpatiale.v1';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, s) { return vnoise(x, y, s) * .6 + vnoise(x * 2, y * 2, s + 7) * .3 + vnoise(x * 4, y * 4, s + 13) * .1; }
const f1 = v => (Math.round(v * 10) / 10).toString().replace('.', ',');

// ---------- Ressources ----------
const RN = {
  m: ['🪨', 'minerai', '#ffb347'], c: ['💎', 'cristaux', '#7ae7ff'], g: ['🧊', 'glace', '#e0fbfc'], f: ['🔩', 'ferraille', '#ced4da'],
  k: ['⚙️', 'métal', '#dee2e6'], i: ['💾', 'circuits', '#80ffaa'], t: ['🔷', 'titane', '#90e0ef'], u: ['☢️', 'uranium', '#b5e48c'],
  h: ['⛽', 'carburant', '#ffd166'], n: ['🥕', 'nourriture', '#f4a261'], a: ['🗿', 'artefacts', '#e0aaff'],
};
const RES_ORDER = ['m', 'c', 'g', 'f', 'k', 'i', 't', 'u', 'h', 'n', 'a'];
const NODE_RES = ['m', 'c', 'g', 'f', 't', 'u', 'a'];
const NODE_COL = ['#ff9f1c', '#4cc9f0', '#caf0f8', '#adb5bd', '#90e0ef', '#b5e48c', '#e0aaff'];
const NODE_NEED = [1, 1, 1, 1, 2, 3, 3]; // niveau de foreuse du robot requis
const NODE_NAME = ['minerai', 'cristaux', 'glace', 'épave', 'titane', 'uranium', 'artefact'];

// ---------- Biomes ----------
// 0 désert rouge, 1 plaine violette, 2 glacier, 3 volcan, 4 forêt de cristaux, 5 cratère alien
const BIOMES = [
  { n: 'Désert rouge', ic: '🏜️', floor: ['#7a3424', '#88402c', '#6a2c1f', '#9a5236'], rock: ['#3a2420', '#6e5a55', '#8f7a72'], mm: '#8a3b2e' },
  { n: 'Plaine violette', ic: '🟣', floor: ['#4a2a5e', '#55316b', '#3e2350', '#6b3f80'], rock: ['#2b1d3a', '#5a4a72', '#7d6b96'], mm: '#5b3a6e' },
  { n: 'Glacier', ic: '❄️', floor: ['#9fc5d8', '#b4d6e6', '#8ab4c9', '#d3ecf5'], rock: ['#3d6e8a', '#7fb2cf', '#c9eaf7'], mm: '#a8cfe0' },
  { n: 'Zone volcanique', ic: '🌋', floor: ['#2b2024', '#36292d', '#221a1d', '#4a3134'], rock: ['#140e10', '#3d2c2c', '#5c4040'], mm: '#3a2a2e' },
  { n: 'Forêt de cristaux', ic: '🔮', floor: ['#1f3b4d', '#244659', '#1a3242', '#2e5b70'], rock: ['#2a3f8f', '#4cc9f0', '#b8f2ff'], mm: '#2a5266' },
  { n: 'Cratère alien', ic: '👽', floor: ['#14261f', '#1a3128', '#0f1d18', '#24453a'], rock: ['#0b1512', '#2d5a4c', '#57cc99'], mm: '#1d3a30' },
];
const TIER_O2 = [1, 1.3, 1.7, 2.1, 2.6];
const TIER_NAME = ['calme', 'agité', 'dangereux', 'très dangereux', 'mortel'];

// ---------- Formules (utilisées par le jeu ET par les fiches) ----------
const F = {
  coreR: L => 5 + L, coreProd: L => 1 + .5 * L, coreStore: L => 100 + 50 * L, dome: L => 84 + 10 * L,
  solar: L => 2.5 * L, battery: L => 150 * L, reactor: L => 12 * L, reactorU: L => 45,
  drillT: L => 8 / L, drillBuf: L => 15 * L, store: L => 250 * L,
  o2R: L => 26 * L, o2Ice: L => 45 / (1 + .5 * (L - 1)), serreT: L => 24 / L, beds: L => 2 * L,
  turret: L => ({ r: 100 + 15 * L, d: 1.5 * L, rate: .75 - .12 * L, e: .3 }),
  cannon: L => ({ r: 150 + 22 * L, d: 6 * L, rate: 1.8 - .25 * L, e: 1 }),
  flamer: L => ({ r: 52 + 9 * L, d: 6 * L, e: 1.2 }),
  mortar: L => ({ r: 220 + 30 * L, min: 70, d: 10 * L, aoe: 32, rate: 3.4 - .5 * L, e: 2 }),
  tesla: L => ({ r: 95 + 15 * L, chain: 2 + L, d: 3 * L, rate: 1.3 - .2 * L, e: 1.5 }),
  shield: L => ({ r: 70 + 20 * L, pool: 200 * L, regen: 8 * L }),
  repair: L => ({ drones: L, r: (5 + 2 * L) * CELL, rate: 4 + 3 * L, spd: 70 + 20 * L }),
  radar: L => ({ reveal: 4 + 3 * L }),
  beacon: L => ({ r: 60 + 25 * L, burn: 1 + L }),
  transport: L => ({ drones: L, cap: 10 * L }),
  lab: L => 1 + .5 * (L - 1),
  rover: L => ({ hp: 250 + 100 * (L - 1), spd: 150 + 20 * (L - 1) }),
};

// ---------- Modules ----------

  const cx = VW / 2, cy = VH / 2, a = Math.atan2(Y - cy, X - cx);
  let t = 1e9; const dx = Math.cos(a), dy = Math.sin(a);
  if (dx > 0) t = Math.min(t, (right - cx) / dx); if (dx < 0) t = Math.min(t, (left - cx) / dx); if (dy > 0) t = Math.min(t, (bot - cy) / dy); if (dy < 0) t = Math.min(t, (top - cy) / dy);
  const ax = cx + dx * t, ay = cy + dy * t;
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-5, -7); ctx.lineTo(-5, 7); ctx.fill(); ctx.fillStyle = frame % 40 < 30 ? '#ffd166' : '#fff'; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -5); ctx.lineTo(-4, 5); ctx.fill(); ctx.restore();
  ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; const tx = ax - dx * 14, ty = ay - dy * 12 + 3;
  ctx.fillStyle = '#000'; ctx.fillText(d + ' m', tx + 1, ty + 1); ctx.fillStyle = '#ffd166'; ctx.fillText(d + ' m', tx, ty);
}
function drawBossBar() {
  const b = enemies.find(e => EN[e.type].boss && dist(e.x, e.y, P.x, P.y) < 600); if (!b) return;
  const w = Math.min(VW * .4, 160), x = (VW - w) / 2, y = cssToCv(118);
  ctx.fillStyle = '#000a'; ctx.fillRect(x - 3, y - 10, w + 6, 16); ctx.fillStyle = '#370617'; ctx.fillRect(x, y, w, 4); ctx.fillStyle = '#ff006e'; ctx.fillRect(x, y, Math.round(w * clamp(b.hp / b.maxHp, 0, 1)), 4);
  ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('👑 ' + EN[b.type].n, VW / 2, y - 2);
}
// ----- mini-carte -----
const mm = $('mm'), mg = mm.getContext('2d');
function renderMinimap() {
  mg.imageSmoothingEnabled = false;
  const S = 150, x0 = clamp(Math.round(P.x / TS - S / 2), 0, MW - S), y0 = clamp(Math.round(P.y / TS - S / 2), 0, MH - S);
  mg.drawImage(W.mmCv, x0, y0, S, S, 0, 0, S, S);
  mg.drawImage(fogCv, 0, 0, EW, EW, -x0, -y0, MW, MH);
  if (G.tools.scanner) for (const n of W.nodes) { if (n.a <= 0 || n.t < 4) continue; const x = n.x - x0, y = n.y - y0; if (x < 0 || y < 0 || x >= S || y >= S) continue; mg.fillStyle = NODE_COL[n.t]; mg.fillRect(x, y, 2, 2); }
  W.pois.forEach((p, i) => {
    const x = p.tx - x0, y = p.ty - y0; if (x < -3 || y < -3 || x > S + 3 || y > S + 3) return;
    const seen = poiVisible(i) || (G.tools.scanner && p.k !== 'lair');
    if (!seen) return;
    if (p.k === 'nest') { if (!G.pd[i]) { mg.fillStyle = '#c77dff'; mg.fillRect(x - 1, y - 1, 3, 3); } }
    else if (p.k === 'pod' && !G.pd[i]) { mg.fillStyle = frame % 30 < 15 ? '#ffd166' : '#fff'; mg.fillRect(x - 2, y - 2, 4, 4); }
    else if (p.k === 'wreck' && !G.pd[i]) { mg.fillStyle = '#ced4da'; mg.fillRect(x - 1, y - 1, 3, 3); }
    else if (p.k === 'ruin' && !G.pd[i]) { mg.fillStyle = '#e0aaff'; mg.fillRect(x - 2, y - 2, 4, 4); }
    else if (p.k === 'lair' && !G.stats.bosses[p.id]) { mg.fillStyle = '#ff006e'; mg.fillRect(x - 2, y - 2, 5, 5); }
  });
  mg.strokeStyle = 'rgba(76,201,240,.6)'; mg.beginPath(); mg.arc(CORE_X / TS - x0, CORE_Y / TS - y0, domeR() / TS, 0, 6.283); mg.stroke();
  for (const m of G.mods) { mg.fillStyle = m.type === 'rocket' ? '#ffd166' : m.type === 'core' ? '#fff' : m.type === 'outpost' ? '#ff6b6b' : '#2ec4b6'; mg.fillRect(m.cx * 2 - x0, m.cy * 2 - y0, 2, 2); }
  if (G.rover && !P.inRover) { mg.fillStyle = '#f4a261'; mg.fillRect((G.rover.x / TS | 0) - x0 - 1, (G.rover.y / TS | 0) - y0 - 1, 3, 3); }
  const radar = hasRadar();
  for (const e of enemies) { if (!(radar && dist(e.x, e.y, CORE_X, CORE_Y) < 900) && dist(e.x, e.y, P.x, P.y) > 160) continue; const b = EN[e.type].boss; mg.fillStyle = '#ff0054'; mg.fillRect((e.x / TS | 0) - x0 - 1, (e.y / TS | 0) - y0 - 1, b ? 4 : 2, b ? 4 : 2); }
  const tg = missionTarget(); if (tg) { const x = clamp(tg.x / TS - x0, 2, S - 3), y = clamp(tg.y / TS - y0, 2, S - 3); mg.strokeStyle = '#ffd166'; mg.strokeRect(x - 2.5, y - 2.5, 5, 5); }
  if (frame % 30 < 20) { mg.fillStyle = '#ffd166'; mg.fillRect((P.x / TS | 0) - x0 - 1, (P.y / TS | 0) - y0 - 1, 3, 3); }
}

// ---------- HUD ----------
const hudCache = {};
function setTxt(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setHTML(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).innerHTML = v; } }
function setW(id, f, low) { const v = Math.round(clamp(f, 0, 1) * 100) + '%'; if (hudCache[id] !== v) { hudCache[id] = v; $(id).style.width = v; } $(id).classList.toggle('low', !!low); }
const fmt = s => { s = Math.max(0, Math.ceil(s)); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
let resSig = '';
function buildResBar() {
  const keys = RES_ORDER.filter(k => G.seen[k] || G.res[k] > 0), sig = keys.join('');
  if (sig === resSig) return; resSig = sig;
  $('resbar').innerHTML = keys.map(k => `<div class="res" id="r${k}">${RN[k][0]} <b id="r${k}b">0</b></div>`).join('');
  for (const k in hudCache) if (/^r.b$/.test(k)) delete hudCache[k];
}
function updateHUD() {
  buildResBar();
  for (const k of RES_ORDER) { const el = $('r' + k + 'b'); if (!el) continue; setTxt('r' + k + 'b', '' + Math.floor(G.res[k])); const full = k !== 'a' && G.res[k] >= resCap(k); const c = $('r' + k); if (c._f !== full) { c._f = full; c.classList.toggle('full', full); } }
  setW('bHp', P.hp / maxHp(), P.hp < maxHp() * .3); setW('bEn', P.en / maxEn(), P.en < 20); setW('bO2', P.o2 / maxO2(), P.o2 < 25);
  $('rvBar').classList.toggle('hidden', !P.inRover);
  if (P.inRover && G.rover) setW('bRv', G.rover.hp / F.rover(garageL()).hp, G.rover.hp < 60);
  setHTML('net', `⚡ ${Math.floor(G.baseE)}/${energyCap()} <span class="p">+${f1(G.prod || 0)}</span> <span class="c">−${f1(G.used || 0)}</span>${G.brown ? ' ⛔ manque d\'énergie' : ''}`);
  $('net').classList.toggle('bad', !!G.brown);
  const night = isNight(); let clk;
  if (G.flags.launch && G.launchT > 0) clk = `🚀 Décollage dans ${fmt(G.launchT)} · 👾 ${enemies.length}`;
  else if (night) clk = `🌙 Nuit ${G.day} · aube dans ${fmt(CYCLE - G.t)}${enemies.length ? ' · 👾 ' + enemies.filter(e => e.wave).length : ''}`;
  else { clk = `☀️ Jour ${G.day} · nuit dans ${fmt(DAY_LEN - G.t)}`; if (G.wave && hasRadar()) clk += ` · 📡 ${G.wave.n} 👾 ${dirName(G.wave.a)}${G.wave.boss ? ' 👑' : ''}`; }
  if (G.ev) clk += G.ev.on ? (G.ev.type === 'storm' ? ' · 🌪️ tempête' : ' · ☄️ météorites') : ' · ⚠️';
  const tier = tierAt(P.x, P.y); if (tier > 0) clk += ` · ${BIOMES[biomeAt(P.x, P.y)].ic} zone ${TIER_NAME[tier]}`;
  setTxt('clock', clk); $('clock').classList.toggle('night', night); $('clock').classList.toggle('storm', !!(G.ev && G.ev.on));
  // objectif
  const m = MISSIONS[G.mi];
  if (m) {
    const p = missionProgress(m), n = MISSIONS.filter(x => x.ch === m.ch), idx = n.indexOf(m) + 1;
    setTxt('objChT', `Chapitre ${m.ch + 1} · ${CHAPTERS[m.ch].n}`); setTxt('objN', `${idx}/${n.length}`);
    setTxt('objT', '🎯 ' + m.n + (p[1] > 1 ? `  (${Math.floor(p[0])}/${p[1]})` : '')); setTxt('objD', m.d); setW('objPf', p[0] / p[1]);
  } else {
    const s = G.side[0]; setTxt('objChT', 'Mode libre'); setTxt('objN', '⭐'); setTxt('objT', s ? s.ic + ' ' + s.n : 'Explore la planète !'); setTxt('objD', 'Missions secondaires dans le journal 📜'); if (s) { const p = sideProgress(s); setW('objPf', p[0] / p[1]); }
  }
  // boutons
  let ic = '🔫', tx = 'Tirer', sh = true;
  if (!P.inRover && !nearestEnemy(P.x, P.y, 130) && !nearestActiveNest(130)) { const tg = mineTarget(); if (tg) { sh = false; ic = '⛏️'; tx = tg.node ? (tg.node.t === 3 ? 'Fouiller' : 'Miner') : 'Casser'; } }
  setTxt('actIc', ic); setTxt('actTx', tx); btnAct.classList.toggle('shoot', sh);
  ctxAction = computeContext(); const cb = $('btnCtx');
  if (ctxAction && !buildMode) { setTxt('btnCtx', ctxAction.ic + ' ' + ctxAction.t); cb.classList.remove('hidden'); } else cb.classList.add('hidden');
  if (buildMode) refreshBuildBar();
}
$('obj').addEventListener('click', () => { if (!paused) openJournal(); });
$('btnJour').onclick = () => { initAudio(); if (!paused) openJournal(); };
$('btnMap').onclick = () => { initAudio(); if (!paused) openMap(); };

// ---------- Titre / pause ----------
function showTitle() {
  paused = true; started = false; $('title').classList.remove('hidden');
  const hs = hasSave(); $('btnCont').classList.toggle('hidden', !hs);
  let old = false; try { old = !localStorage.getItem(SAVE_KEY) && !!localStorage.getItem(OLD_KEY); } catch (e) { }
  $('btnCont').textContent = old ? '▶ Continuer (ta partie passe en version 2)' : '▶ Continuer';
  $('btnNew').textContent = '✨ Nouvelle partie'; $('btnNew')._armed = false;
}
function startPlay() {
  $('title').classList.add('hidden'); paused = false; started = true; resetJoyVisual(); survPos = [];
  if (buildMode) toggleBuild(); refreshBuildBar(true); resSig = '';
  powerTick(1);
  if (G.migrated) { G.migrated = false; setTimeout(() => openModal(`<h2>✨ Base spatiale 2</h2><p>Ta base a été transférée sur une <b>nouvelle planète 6× plus grande</b>, avec 6 biomes, 5 chapitres de missions, 30 modules, des recherches, des survivants à sauver et 4 boss.</p><p>Tes outils et tes ressources sont gardés. La fusée est maintenant l'objectif final de l'aventure : tu as été remboursé de ses réparations.</p><div class="row"><button class="bigbtn green" id="mClose">C'est parti !</button></div>`), 300); setTimeout(() => { const b = $('mClose'); if (b) b.onclick = closeModal; }, 400); }
  else if (G.mi === 0 && G.stats.moved < 5) banner('Chapitre 1', CHAPTERS[0].n, CHAPTERS[0].intro, 4);
}
$('btnCont').onclick = () => { initAudio(); if ((G && !G.demo) || loadGame()) startPlay(); else { newGame(); startPlay(); } };
$('btnNew').onclick = () => {
  initAudio(); const b = $('btnNew');
  if (hasSave() && !b._armed) { b._armed = true; b.textContent = '⚠ Effacer la partie et recommencer ?'; return; }
  newGame(); startPlay();
};
$('btnPause').onclick = () => {
  if (!started || G.over) return;
  openModal(`<h2>⏸ Pause</h2><p>Jour ${G.day} · Chapitre ${chapterL() + 1} · 👥 ${G.surv.length}/5 · 🚀 ${G.stage}/${STAGES.length}</p><p style="font-size:15px;opacity:.85">Joystick à gauche pour bouger · gros bouton pour miner / tirer · bouton violet pour les actions (ouvrir, monter dans le rover…) · 🔧 pour construire · touche un module pour sa fiche · 📜 journal · 🗺️ carte. Clavier : ZQSD/flèches, Espace, E, B, J, M.</p><div class="row"><button class="bigbtn green" id="pRes">▶ Reprendre</button><button class="bigbtn grey" id="pTitle">Sauver et quitter</button></div>`);
  $('pRes').onclick = closeModal; $('pTitle').onclick = () => { saveGame(); $('modal').classList.add('hidden'); showTitle(); };
};
function setSnd() { $('btnSnd').textContent = soundOn ? '🔊' : '🔇'; try { localStorage.setItem('baseSpatiale.snd', soundOn ? '1' : '0'); } catch (e) { } }
$('btnSnd').onclick = () => { initAudio(); soundOn = !soundOn; setSnd(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveGame(); if (started && !paused && !G.over) $('btnPause').onclick(); } });
addEventListener('pagehide', saveGame);

// ---------- Boucle ----------
let last = performance.now(), hudT = 0, mmT = 0, saveT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now; if (dt > .05) dt = .05;
  if (!G) return;
  try {
    if (!paused && started) { update(dt); saveT += dt; if (saveT > 15) { saveT = 0; saveGame(); } }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
    render();
    hudT += dt; if (hudT > .1) { hudT = 0; updateHUD(); }
    mmT += dt; if (mmT > .25) { mmT = 0; renderMinimap(); }
  } catch (e) { console.error(e); if (!window._errShown) { window._errShown = 1; toast('Oups, petite erreur : ' + e.message, 4); } }
}
// ---------- Démarrage ----------
function demoWorld() {
  genWorld(12345); W.minedMark = new Uint8Array(MW * MH); buildMapCanvas(); G = freshG(12345); G.demo = true; G.t = 30; G.explored.fill(1); resetRuntime();
  addMod('core', CC, CC); addMod('solar', CC + 1, CC); addMod('turret', CC - 1, CC); addMod('lab', CC, CC - 1); addMod('repair', CC + 1, CC + 1); addMod('shield', CC - 1, CC + 1);
  Object.assign(P, { x: CORE_X, y: CORE_Y + 40 }); initFog(); genSide();
}
buildSprites(); resize(); setSnd();
if (!(hasSave() && loadGame())) demoWorld();
showTitle(); resetJoyVisual();
requestAnimationFrame(loop);
</script>
