<style>

  #btnAct { position: fixed; right: calc(22px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%; background: #e76f51; border: 5px solid #ffffff99; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #00000066; }
  #btnAct.held { background: #f4a261; transform: scale(.94); }

  #btnBuild { position: fixed; right: calc(158px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom)); width: 92px; height: 78px; background: #2a9d8f; border: 4px solid #ffffff88; z-index: 6; font-weight: 900; font-size: 15px; line-height: 1.15; box-shadow: 0 5px 0 #00000066; }
  #btnBuild span { font-size: 28px; }
  #btnBuild.on { background: #ffd166; color: #1b1033; }
  #buildBar { position: fixed; left: calc(8px + env(safe-area-inset-left)); right: calc(262px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap-reverse; justify-content: center; gap: 6px; z-index: 6; }
  .card { background: #1d1235ee; border: 3px solid #ffffff33; width: 86px; padding: 5px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .card .ic { font-size: 26px; line-height: 1.1; }
  .card .nm { font-weight: 800; font-size: 12px; text-align: center; line-height: 1.1; min-height: 26px; display: flex; align-items: center; }
  .card .pr { font-size: 12px; font-weight: 700; color: #ffd166; white-space: nowrap; }
  .card.sel { border-color: #ffd166; background: #3c2a63; }
  .card.poor { opacity: .45; }
  .no { color: #ff6b6b; }
  .ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: #0a0614cc; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .box { background: #24173f; border: 4px solid #ffffff33; border-radius: 18px; padding: 18px 20px; width: min(560px, 92vw); max-height: 88vh; overflow: hidden; box-shadow: 0 10px 0 #00000066; }
  .box h2 { margin: 0 0 6px; font-size: 26px; }

  .bigbtn.green { background: #2a9d8f; } .bigbtn.red { background: #c1121f; } .bigbtn.grey { background: #4a4e69; } .bigbtn.gold { background: #e9a100; color: #1b1033; }
  .bigbtn:disabled { opacity: .4; }

  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
</style>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TS = 16, MW = 128, MH = 128, CELL = 32, CC = 32; // core cell
const CORE_X = CC * CELL + 16, CORE_Y = CC * CELL + 16;
const DAY_LEN = 150, NIGHT_LEN = 75, CYCLE = DAY_LEN + NIGHT_LEN, BUILD_R = 7;
const SAVE_KEY = 'baseSpatiale.v1';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = (a, b) => a + Math.random() * (b - a);
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, s) { return vnoise(x, y, s) * .6 + vnoise(x * 2, y * 2, s + 7) * .3 + vnoise(x * 4, y * 4, s + 13) * .1; }

// ---------- Données ----------
const RN = { m: ['🪨', 'minerai'], c: ['💎', 'cristaux'], g: ['🧊', 'glace'], f: ['🔩', 'ferraille'] };
const MODS = {
  core:     { n: 'Noyau', ic: '🏠', hp: 500, cost: {}, desc: "Le cœur de ta base : il crée le dôme d'air et un peu d'énergie. S'il est détruit, la partie est perdue !" },
  solar:    { n: 'Panneau solaire', ic: '☀️', hp: 60, cost: { m: 6 }, desc: "Produit de l'énergie pour la base pendant le jour." },
  battery:  { n: 'Batterie', ic: '🔋', hp: 80, cost: { m: 8, c: 1 }, desc: "Stocke plus d'énergie pour tenir la nuit." },
  drill:    { n: 'Foreuse auto', ic: '⛏️', hp: 90, cost: { m: 12, f: 2 }, desc: "Extrait du minerai toute seule (consomme de l'énergie)." },
  oxygen:   { n: 'Générateur O₂', ic: '🫧', hp: 70, cost: { m: 8, g: 4 }, desc: "Agrandit le dôme d'air et recharge ton oxygène plus vite." },
  serre:    { n: 'Serre', ic: '🌱', hp: 60, cost: { m: 6, g: 6 }, desc: "Répare ton robot dans le dôme et soigne les modules." },
  wall:     { n: 'Mur', ic: '🧱', hp: 170, cost: { m: 3 }, desc: "Bloque les créatures qui marchent." },
  turret:   { n: 'Tourelle laser', ic: '🔫', hp: 100, cost: { m: 10, c: 2 }, desc: "Tire toute seule sur les créatures (utilise l'énergie de la base)." },
  radar:    { n: 'Radar-phare', ic: '📡', hp: 60, cost: { m: 6, c: 2 }, desc: "Éclaire la nuit et montre les créatures sur la mini-carte." },
  workshop: { n: 'Atelier', ic: '🛠️', hp: 120, cost: { m: 15, f: 4 }, unique: true, desc: "Fabrique de meilleurs outils pour ton robot." },
  rocket:   { n: 'Fusée', ic: '🚀', hp: 300, cost: { m: 20, f: 8 }, unique: true, desc: "Ta fusée de secours. Répare-la étape par étape pour rentrer !" },
};
const BUILD_ORDER = ['solar', 'battery', 'drill', 'oxygen', 'serre', 'wall', 'turret', 'radar', 'workshop', 'rocket'];
const TOOLS = [
  { id: 'drill2', n: 'Foreuse renforcée', ic: '⛏️', cost: { m: 10, c: 3 }, desc: 'Mine 2× plus vite.' },
  { id: 'drill3', n: 'Foreuse diamant', ic: '💠', cost: { m: 20, c: 8, f: 4 }, req: 'drill2', desc: 'Mine 3× plus vite.' },
  { id: 'gun2', n: 'Pistolet laser', ic: '🔫', cost: { m: 12, c: 5, f: 3 }, desc: 'Tirs plus forts et plus rapides.' },
  { id: 'gun3', n: 'Canon plasma', ic: '💥', cost: { c: 15, f: 10 }, req: 'gun2', desc: 'Gros tirs qui traversent les ennemis.' },
  { id: 'jet', n: 'Propulseurs', ic: '💨', cost: { f: 6, c: 3 }, desc: '+40 % de vitesse.' },
  { id: 'tank', n: 'Grands réservoirs', ic: '🛢️', cost: { m: 10, g: 8 }, desc: 'Énergie et oxygène max +60.' },
  { id: 'armor', n: 'Blindage', ic: '🛡️', cost: { m: 15, f: 6 }, desc: 'Points de vie max +60.' },
];
const STAGES = [
  { n: 'Coque', ic: '🛡️', cost: { f: 15, m: 25 } },
  { n: 'Moteurs', ic: '🔥', cost: { m: 35, c: 12 } },
  { n: 'Réservoirs', ic: '🛢️', cost: { g: 25, c: 8 } },
  { n: 'Ordinateur de bord', ic: '🖥️', cost: { c: 25, f: 20 } },
  { n: 'Carburant', ic: '⛽', cost: { g: 35, c: 15, m: 30 } },
];
const EN = {
  crawler: { n: 'Rampeur', hp: 4, spd: 40, r: 5, dmg: 6, rate: .8 },
  drone:   { n: 'Drone', hp: 3, spd: 54, r: 5, dmg: 4, rate: .7, fly: true },
  spitter: { n: 'Cracheur', hp: 9, spd: 24, r: 6, dmg: 9, rate: 2.2, range: 85 },
  boss:    { n: 'Reine des sables', hp: 140, spd: 17, r: 12, dmg: 22, rate: 1.2, boss: true },
};
const NODE_COL = ['#ff9f1c', '#4cc9f0', '#caf0f8', '#adb5bd'];
const NODE_RES = ['m', 'c', 'g', 'f'];

// ---------- Sprites (dessinés en code) ----------
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g); return c; }
function px(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function circ(g, cx, cy, r, col) { g.fillStyle = col; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .6) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1); }
function drawRobot(g) {
  px(g, '#2b2d42', 1, 2, 3, 11); px(g, '#2b2d42', 10, 2, 3, 11);
  for (let y = 3; y < 13; y += 2) { px(g, '#8d99ae', 1, y, 3, 1); px(g, '#8d99ae', 10, y, 3, 1); }
  px(g, '#b5651d', 4, 3, 6, 10); px(g, '#f4a300', 4, 3, 6, 9); px(g, '#ffd166', 5, 5, 4, 2);
  px(g, '#1d3557', 4, 1, 6, 4); px(g, '#4cc9f0', 5, 2, 4, 2); px(g, '#ffffff', 5, 2, 1, 1);
  px(g, '#e63946', 6, 10, 2, 2); px(g, '#6c757d', 3, 6, 1, 3); px(g, '#6c757d', 10, 6, 1, 3);
}
const SPR = {};
function buildSprites() {
  SPR.robot = mk(14, 14, drawRobot);
  drawRobot($('titleRobot').getContext('2d'));
  SPR.crawler = mk(12, 12, g => {
    for (let i = 0; i < 3; i++) { px(g, '#1b4332', 0, 3 + i * 3, 3, 1); px(g, '#1b4332', 9, 3 + i * 3, 3, 1); }
    circ(g, 6, 6, 4, '#2d6a4f'); circ(g, 6, 6, 3, '#52b788'); px(g, '#95d5b2', 5, 4, 2, 3);
    px(g, '#ff0054', 4, 2, 1, 1); px(g, '#ff0054', 7, 2, 1, 1); px(g, '#1b4332', 4, 0, 1, 2); px(g, '#1b4332', 7, 0, 1, 2);
  });
  SPR.drone = mk(12, 12, g => {
    circ(g, 2, 2, 2, '#9d4edd88'); circ(g, 9, 2, 2, '#9d4edd88'); circ(g, 2, 9, 2, '#9d4edd88'); circ(g, 9, 9, 2, '#9d4edd88');
    px(g, '#3c096c', 2, 2, 8, 1); px(g, '#3c096c', 2, 9, 8, 1);
    circ(g, 6, 6, 3, '#7b2cbf'); px(g, '#e0aaff', 5, 4, 2, 1); px(g, '#ff0054', 5, 6, 2, 2);
  });
  SPR.spitter = mk(14, 14, g => {
    circ(g, 7, 7, 6, '#9c4400'); circ(g, 7, 7, 5, '#f77f00'); circ(g, 7, 8, 3, '#fcbf49');
    px(g, '#370617', 5, 1, 4, 3); px(g, '#d9ed92', 6, 1, 2, 1); px(g, '#000', 4, 5, 1, 1); px(g, '#000', 9, 5, 1, 1);
    for (let i = 0; i < 4; i++) px(g, '#9c4400', 1 + i * 4, 12, 2, 2);
  });
  SPR.boss = mk(28, 28, g => {
    for (let i = 0; i < 4; i++) { px(g, '#370617', 0, 8 + i * 4, 5, 2); px(g, '#370617', 23, 8 + i * 4, 5, 2); }
    circ(g, 14, 15, 10, '#6a040f'); circ(g, 14, 15, 9, '#d00000'); circ(g, 14, 16, 5, '#e85d04');
    px(g, '#370617', 6, 1, 3, 7); px(g, '#370617', 19, 1, 3, 7); px(g, '#9d0208', 4, 0, 4, 3); px(g, '#9d0208', 20, 0, 4, 3);
    px(g, '#ffba08', 10, 8, 2, 2); px(g, '#ffba08', 16, 8, 2, 2); px(g, '#ffba08', 13, 11, 2, 1);
    for (let i = 0; i < 4; i++) px(g, '#ffba08', 11 + i * 2, 18 + (i % 2), 1, 1);
  });
  // ressources (16x16)
  SPR.nodes = [
    mk(16, 16, g => { circ(g, 8, 9, 6, '#4a4e69'); circ(g, 8, 8, 5, '#6c757d'); [[5, 6], [9, 5], [7, 10], [11, 9], [6, 8]].forEach(([x, y]) => { px(g, '#ff9f1c', x, y, 2, 2); px(g, '#ffd166', x, y, 1, 1); }); }),

function renderMinimap() {
  mg.imageSmoothingEnabled = false;
  mg.drawImage(W.mmCv, 0, 0);
  mg.fillStyle = 'rgba(10,6,20,0.82)';
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (!G.explored[y * 32 + x]) mg.fillRect(x * 4, y * 4, 4, 4);
  for (const n of W.nodes) { if (n.a <= 0 || n.t === 0 || !G.explored[(n.y >> 2) * 32 + (n.x >> 2)]) continue; mg.fillStyle = NODE_COL[n.t]; mg.fillRect(n.x, n.y, 1, 1); }
  mg.strokeStyle = 'rgba(76,201,240,.6)'; mg.beginPath(); mg.arc(CORE_X / TS, CORE_Y / TS, domeR() / TS, 0, 6.283); mg.stroke();
  for (const m of G.mods) { mg.fillStyle = m.type === 'rocket' ? '#ffd166' : m.type === 'core' ? '#fff' : '#2ec4b6'; mg.fillRect(m.cx * 2, m.cy * 2, 2, 2); }
  const radar = count('radar') > 0;
  for (const e of enemies) { if (!radar && dist(e.x, e.y, P.x, P.y) > 150) continue; mg.fillStyle = '#ff0054'; mg.fillRect((e.x / TS | 0) - 1, (e.y / TS | 0) - 1, EN[e.type].boss ? 4 : 2, EN[e.type].boss ? 4 : 2); }
  if (frame % 30 < 20) { mg.fillStyle = '#ffd166'; mg.fillRect((P.x / TS | 0) - 1, (P.y / TS | 0) - 1, 3, 3); }
  mg.strokeStyle = 'rgba(255,255,255,.5)'; mg.strokeRect(cam.x / TS, cam.y / TS, VW / TS, VH / TS);
}
// HUD
const hudCache = {};
function setTxt(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function setW(id, f, low) { const v = Math.round(clamp(f, 0, 1) * 100) + '%'; if (hudCache[id] !== v) { hudCache[id] = v; $(id).style.width = v; } $(id).classList.toggle('low', !!low); }
const fmt = s => { s = Math.max(0, Math.ceil(s)); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };
function updateHUD() {
  for (const k of 'mcgf') setTxt('r' + k + 'b', '' + G.res[k]);
  setTxt('rEb', Math.floor(G.baseE) + '/' + (G.cap || energyCap()));
  setW('bHp', P.hp / maxHp(), P.hp < maxHp() * .3); setW('bEn', P.en / maxEn(), P.en < 20); setW('bO2', P.o2 / maxO2(), P.o2 < 25);
  const night = isNight();
  setTxt('clock', night ? `🌙 Nuit ${G.day} · aube dans ${fmt(CYCLE - G.t)}${enemies.length ? ' · 👾 ' + enemies.length : ''}` : `☀️ Jour ${G.day} · nuit dans ${fmt(DAY_LEN - G.t)}`);
  $('clock').classList.toggle('night', night);
  // bouton d'action
  let ic = '🔫', tx = 'Tirer', sh = true;
  if (!nearestEnemy(P.x, P.y, 130)) { const tg = mineTarget(); if (tg) { sh = false; ic = '⛏️'; tx = tg.node ? (tg.node.t === 3 ? 'Fouiller' : 'Miner') : 'Casser'; } }
  setTxt('actIc', ic); setTxt('actTx', tx); btnAct.classList.toggle('shoot', sh);
  if (buildMode) refreshBuildBar();
}
['m', 'c', 'g', 'f', 'E'].forEach(k => { const b = $('r' + k).querySelector('b'); b.id = 'r' + k + 'b'; });

// ---------- Boucle ----------
let last = performance.now(), hudT = 0, mmT = 0, saveT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now; if (dt > .05) dt = .05;
  if (!G) return;
  if (!paused && started) {
    update(dt);
    saveT += dt; if (saveT > 15) { saveT = 0; saveGame(); }
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  render();
  hudT += dt; if (hudT > .1) { hudT = 0; updateHUD(); }
  mmT += dt; if (mmT > .25) { mmT = 0; renderMinimap(); }
}
// ---------- Démarrage ----------
buildSprites(); resize(); setSnd();
if (!(hasSave() && loadGame())) { genWorld(12345); buildMapCanvas(); G = { seed: 12345, res: { m: 0, c: 0, g: 0, f: 0 }, day: 1, t: 30, baseE: 0, tools: {}, stage: 0, kills: 0, tut: 99, mods: [], explored: new Uint8Array(1024).fill(1) }; modAt.clear(); addMod('core', CC, CC); addMod('solar', CC + 1, CC); addMod('turret', CC - 1, CC); addMod('rocket', CC, CC - 2); Object.assign(P, { x: CORE_X, y: CORE_Y + 40 }); }
showTitle(); resetJoyVisual();
requestAnimationFrame(loop);
</script>
